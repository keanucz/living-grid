[project]
name = "living-grid"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pandas",
  "pyarrow",
  "lightgbm",
  "scikit-learn",
  "fastapi",
  "uvicorn",
  "httpx",
  "yfinance",
  "shapely",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["pipeline", "engine"]
pythonpath = ["."]
